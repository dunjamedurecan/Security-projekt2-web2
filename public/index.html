<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ranjivosti</title>
        <link rel="stylesheet" href="styles/app.css" />
    </head>
    <body>
        <main>
            <h1>Demonstracija web ranjivosti</h1>
            <section class="card mode">
                <label>
                    <input type="checkbox" id="ranaToggle" checked>
                    <strong>SQL injection: ranjiva verzija uključena</strong>
                </label>
                <small>Kvačica = upiti se grade spajanjem nizova. Bez kvačice = parametrizirani upiti.</small>
            </section>
            <section class="card mode">
                <label>
                    <input type="checkbox" id="authToggle" checked>
                    <strong>Broken authentification: ranjiva verzija uključena</strong>
                </label>
                <small>Kvačica = sesijski token je Base64(JSON) bez potpisa. Bez kvačice = nasumičan token s mapiranjem na serveru</small>
            </section>

            <div class="grid">
                <section class="card">
                    <h2> 1. Prijava (tautologija)</h2>
                    <label for="u">Korisničko ime</label>
                    <input type="text" id="u" autocomplete="off">
                    <label for="p">Lozinka</label>
                    <input type="text" id="p" autocomplete="off">
                    <button id="loginBtn">Prijavi se</button>
                    <div id="loginMsg"></div>
                    <pre id="loginQuery">Izvršeni SQL će se prikazati ovdje</pre>
                </section>
            </div>
        </main>
    </body>
    <script src="scripts/app.js" ></script>
</html>
